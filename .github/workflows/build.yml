name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Release)
        run: dotnet build SWCUOPlugin/SWCUOPlugin.csproj -c Release

      - name: Test trampoline
        run: dotnet run --project NativeTrampolineTest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: SWCUOPlugin
          path: SWCUOPlugin/bin/Release/net472/SWCUOPlugin.dll
